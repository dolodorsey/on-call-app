    <style>
      *,*::before,*::after{box-sizing:border-box}
      html{min-height:100%;background:#dfe5ef}
      body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#fff 0%,#edf1f7 45%,#dfe5ef 100%);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden}
      #root{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;position:relative;overflow:hidden;isolation:isolate;transform:translateZ(0);background:#f8f9fc;box-shadow:0 0 0 1px rgba(15,23,42,.08),0 28px 90px rgba(15,23,42,.22)}
      @media(min-width:521px){body{padding:24px}#root{min-height:calc(100dvh - 48px);border-radius:30px}}
      @media(max-width:520px){#root{max-width:none;box-shadow:none;border-radius:0}}
