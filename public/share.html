<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#071426"/><title>ON CALL — Shared Live Tracking</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#183c70,transparent 34%),linear-gradient(160deg,#06101d,#0c1e33 60%,#060b13);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.shell{max-width:760px;margin:0 auto}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:14px;background:#1765e8;display:grid;place-items:center;font-weight:1000}.brand strong{display:block;font-size:14px;letter-spacing:.06em}.brand span{font-size:9px;letter-spacing:.12em;color:#89a2c4}.card{margin-top:22px;background:rgba(10,24,42,.92);border:1px solid rgba(255,255,255,.1);border-radius:24px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.38)}.map{height:330px;background:#0b1727;position:relative}.map iframe{width:100%;height:100%;border:0;filter:saturate(.8) contrast(1.05)}.pill{position:absolute;top:14px;left:14px;background:rgba(7,20,38,.9);padding:8px 10px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em}.sheet{padding:20px}.k{font-size:9px;font-weight:900;letter-spacing:.13em;color:#79d1ff}.sheet h1{font-size:30px;margin:6px 0 6px;letter-spacing:-.03em}.sub{color:#a9bbd3;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.fact{padding:12px;background:rgba(255,255,255,.055);border-radius:14px}.fact small{font-size:8px;color:#7990ae;display:block}.fact strong{font-size:13px;display:block;margin-top:3px}.provider{margin-top:12px;padding:13px;border-radius:15px;background:rgba(23,101,232,.1);border:1px solid rgba(76,151,255,.2)}.provider small{font-size:8px;color:#79d1ff;font-weight:900}.provider strong{display:block;margin-top:3px}.msg{margin-top:28px;padding:20px;text-align:center;color:#abc0dc;font-size:12px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(7,20,38,.7)}.foot{font-size:9px;color:#6f829f;margin-top:12px;text-align:center}@media(max-width:560px){body{padding:12px}.map{height:280px}.sheet h1{font-size:25px}.grid{grid-template-columns:1fr 1fr}.grid .fact:last-child{grid-column:1/-1}}</style></head><body><main class="shell"><div class="brand"><div class="mark">OC</div><div><strong>ON CALL</strong><span>TRUSTED LIVE TRACKING</span></div></div><section id="card" class="card" hidden><div class="map" id="map"><div class="pill" id="livePill">LIVE TRACKING</div></div><div class="sheet"><div class="k" id="status">ACTIVE SERVICE</div><h1 id="service">ON CALL service</h1><div class="sub" id="address"></div><div class="grid"><div class="fact"><small>DISTANCE</small><strong id="distance">—</strong></div><div class="fact"><small>ETA</small><strong id="eta">—</strong></div><div class="fact"><small>GPS</small><strong id="gps">Waiting</strong></div></div><div class="provider" id="provider" hidden><small>ASSIGNED PROVIDER</small><strong id="providerName"></strong><span class="sub" id="providerMeta"></span></div></div></section><div id="message" class="msg">Opening trusted tracking…</div><div class="foot">This link provides temporary tracking only. It does not grant access to the customer’s ON CALL account.</div></main><script>const ENDPOINT='https://cxdqkjvtpilvouwtbgdy.supabase.co/functions/v1/oc-shared-booking';const token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);let timer=null;function esc(v){return String(v??'')}function age(ts){if(!ts)return'Waiting';const s=Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/1000));return s<10?'Live':s<60?s+'s ago':Math.floor(s/60)+'m ago'}function mapUrl(lat,lng,labelLat,labelLng){const a=Number(lat),b=Number(lng),x=Number(labelLat??lat),y=Number(labelLng??lng);return'https://www.openstreetmap.org/export/embed.html?bbox='+(b-.035)+'%2C'+(a-.025)+'%2C'+(b+.035)+'%2C'+(a+.025)+'&layer=mapnik&marker='+x+'%2C'+y}async function load(){if(!/^[a-f0-9]{48}$/i.test(token)){showError('This tracking link is invalid.');return}try{const r=await fetch(ENDPOINT+'?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok){showError(d.error||'Tracking link unavailable.');if(r.status===410&&timer)clearInterval(timer);return}$('message').hidden=true;$('card').hidden=false;$('status').textContent=esc(d.booking?.status).replaceAll('_',' ').toUpperCase();$('service').textContent=d.booking?.service_name||'ON CALL service';$('address').textContent=d.booking?.address||'Service location';$('distance').textContent=d.distance_miles==null?'—':Number(d.distance_miles).toFixed(1)+' mi';$('eta').textContent=d.eta_minutes?d.eta_minutes+' min':'—';$('gps').textContent=age(d.live_location?.updated_at);if(d.provider){$('provider').hidden=false;$('providerName').textContent=d.provider.name||'ON CALL provider';$('providerMeta').textContent='★ '+Number(d.provider.rating||5).toFixed(1)+' · '+Number(d.provider.completed_jobs||0)+' completed'}else $('provider').hidden=true;const lat=d.live_location?.lat??d.booking?.lat,lng=d.live_location?.lng??d.booking?.lng;if(lat!=null&&lng!=null){$('map').querySelector('iframe')?.remove();const f=document.createElement('iframe');f.title='Shared ON CALL live map';f.src=mapUrl(lat,lng,d.booking?.lat,d.booking?.lng);f.loading='lazy';$('map').prepend(f)}$('livePill').textContent=d.share?.terminal?'SERVICE CLOSED':'LIVE TRACKING';if(d.share?.terminal&&timer){clearInterval(timer);timer=null}}catch{showError('Tracking is temporarily unavailable.')}}function showError(text){$('card').hidden=true;$('message').hidden=false;$('message').textContent=text}load();timer=setInterval(load,10000);</script></body></html>
