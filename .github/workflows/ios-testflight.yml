name: ON CALL iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'components/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'Gemfile'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: on-call-ios-testflight
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify-build-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TESTFLIGHT_CHANGELOG: Automated ON CALL build from ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Load Apple release credentials from Supabase
        shell: bash
        env:
          APPLE_CREDENTIAL_BROKER_URL: https://dzlmtvodpyhetvektfuo.supabase.co/functions/v1/github-apple-release-credentials
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo 'GitHub OIDC request URL unavailable'; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo 'GitHub OIDC request token unavailable'; exit 1; }

          TOKEN_FILE="$RUNNER_TEMP/github-oidc.json"
          CRED_FILE="$RUNNER_TEMP/apple-release-credentials.json"
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kollective-apple-release" \
            -o "$TOKEN_FILE"

          OIDC_TOKEN=$(python3 - "$TOKEN_FILE" <<'PY'
          import json,sys
          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              print(json.load(f)['value'])
          PY
          )
          [[ -n "$OIDC_TOKEN" ]] || { echo 'GitHub OIDC token was empty'; exit 1; }

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$APPLE_CREDENTIAL_BROKER_URL" \
            -o "$CRED_FILE"

          python3 - "$CRED_FILE" "$GITHUB_ENV" <<'PY'
          import json,secrets,sys
          source,env_path=sys.argv[1],sys.argv[2]
          with open(source,'r',encoding='utf-8') as f:
              data=json.load(f)
          mapping={
              'ASC_KEY_ID':'key_id',
              'ASC_ISSUER_ID':'issuer_id',
              'ASC_KEY_CONTENT_BASE64':'key_content_base64',
              'IOS_DISTRIBUTION_CERT_BASE64':'distribution_cert_base64',
              'IOS_DISTRIBUTION_CERT_PASSWORD':'distribution_cert_password',
              'IOS_PROVISIONING_PROFILE_BASE64':'provisioning_profile_base64',
              'IOS_KEYCHAIN_PASSWORD':'keychain_password',
              'APPLE_TEAM_ID':'team_id',
          }
          missing=[field for field in mapping.values() if not str(data.get(field,'')).strip() and field!='keychain_password']
          if missing:
              raise SystemExit('Supabase Apple release credential response is incomplete')
          with open(env_path,'a',encoding='utf-8') as env:
              for env_name,field in mapping.items():
                  value=str(data.get(field,'') or '')
                  delimiter='GHENV_'+secrets.token_hex(12)
                  env.write(f'{env_name}<<{delimiter}\n{value}\n{delimiter}\n')
          PY
          rm -f "$TOKEN_FILE" "$CRED_FILE"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Validate Apple API credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" ]] || { echo 'Missing Supabase credential: ASC_KEY_ID'; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo 'Missing Supabase credential: ASC_ISSUER_ID'; exit 1; }
          [[ -n "$ASC_KEY_CONTENT_BASE64" ]] || { echo 'Missing Supabase credential: ASC_KEY_CONTENT_BASE64'; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERT_BASE64" ]] || { echo 'Missing Supabase credential: IOS_DISTRIBUTION_CERT_BASE64'; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERT_PASSWORD" ]] || { echo 'Missing Supabase credential: IOS_DISTRIBUTION_CERT_PASSWORD'; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo 'Missing Supabase credential: IOS_PROVISIONING_PROFILE_BASE64'; exit 1; }
          [[ -n "$APPLE_TEAM_ID" ]] || { echo 'Missing Supabase credential: APPLE_TEAM_ID'; exit 1; }

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_CONTENT_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare signing keychain and signing assets
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/on-call-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/on-call-distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PATH="$RUNNER_TEMP/on-call.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/on-call-profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Full product quality gate
        run: npm run verify

      - name: Sync Capacitor iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Build, sign, and upload to TestFlight
        working-directory: ios/App
        run: bundle exec fastlane ios beta
