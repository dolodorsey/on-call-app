name: ON CALL iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'components/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'Gemfile'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: on-call-ios-testflight
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  verify-build-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TESTFLIGHT_CHANGELOG: Automated ON CALL build from ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Scrub superseded signing logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --location --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /dev/null \
            --write-out 'legacy signing log scrub HTTP %{http_code}\n' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31302614506/logs" || true

      - name: Prepare Apple release signing from Supabase
        shell: bash
        env:
          APPLE_CREDENTIAL_BROKER_URL: https://dzlmtvodpyhetvektfuo.supabase.co/functions/v1/github-apple-release-credentials
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo 'GitHub OIDC request URL unavailable'; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo 'GitHub OIDC request token unavailable'; exit 1; }

          TOKEN_FILE="$RUNNER_TEMP/github-oidc.json"
          CRED_FILE="$RUNNER_TEMP/apple-release-credentials.json"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          CERT_PATH="$RUNNER_TEMP/on-call-distribution.p12"
          CERT_PASSWORD_PATH="$RUNNER_TEMP/on-call-distribution-password"
          META_FILE="$RUNNER_TEMP/apple-release-meta.json"

          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kollective-apple-release" \
            -o "$TOKEN_FILE"

          OIDC_TOKEN=$(python3 - "$TOKEN_FILE" <<'PY'
          import json,sys
          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              print(json.load(f)['value'])
          PY
          )
          [[ -n "$OIDC_TOKEN" ]] || { echo 'GitHub OIDC token was empty'; exit 1; }

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$APPLE_CREDENTIAL_BROKER_URL" \
            -o "$CRED_FILE"

          python3 - "$CRED_FILE" "$KEY_PATH" "$CERT_PATH" "$CERT_PASSWORD_PATH" "$META_FILE" <<'PY'
          import base64,json,os,sys
          source,key_path,cert_path,password_path,meta_path=sys.argv[1:]
          with open(source,'r',encoding='utf-8') as f:
              data=json.load(f)
          required=['key_id','issuer_id','team_id','key_content_base64','distribution_cert_base64','distribution_cert_password']
          if any(not str(data.get(k,'')).strip() for k in required):
              raise SystemExit('Supabase Apple release credential response is incomplete')
          with open(key_path,'wb') as f:
              f.write(base64.b64decode(data['key_content_base64']))
          with open(cert_path,'wb') as f:
              f.write(base64.b64decode(data['distribution_cert_base64']))
          with open(password_path,'w',encoding='utf-8') as f:
              f.write(str(data['distribution_cert_password']))
          with open(meta_path,'w',encoding='utf-8') as f:
              json.dump({'key_id':data['key_id'],'issuer_id':data['issuer_id'],'team_id':data['team_id']},f)
          os.chmod(key_path,0o600); os.chmod(cert_path,0o600); os.chmod(password_path,0o600)
          PY

          KEY_ID=$(python3 -c "import json; print(json.load(open('$META_FILE'))['key_id'])")
          ISSUER_ID=$(python3 -c "import json; print(json.load(open('$META_FILE'))['issuer_id'])")
          TEAM_ID=$(python3 -c "import json; print(json.load(open('$META_FILE'))['team_id'])")
          [[ -s "$KEY_PATH" && -s "$CERT_PATH" && -n "$KEY_ID" && -n "$ISSUER_ID" && -n "$TEAM_ID" ]] || { echo 'Apple signing files are incomplete'; exit 1; }

          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/on-call-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          CERT_PASSWORD=$(cat "$CERT_PASSWORD_PATH")

          echo 'Stored distribution certificate metadata:'
          openssl pkcs12 -in "$CERT_PATH" -clcerts -nokeys -passin "pass:${CERT_PASSWORD}" 2>/dev/null | openssl x509 -noout -subject -issuer -dates

          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo 'Available code-signing identities:'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          {
            echo "ASC_KEY_ID=$KEY_ID"
            echo "ASC_ISSUER_ID=$ISSUER_ID"
            echo "APPLE_TEAM_ID=$TEAM_ID"
            echo "ASC_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

          rm -f "$TOKEN_FILE" "$CRED_FILE" "$CERT_PATH" "$CERT_PASSWORD_PATH" "$META_FILE"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Validate prepared Apple API identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$APPLE_TEAM_ID" ]] || { echo 'Apple API identity is incomplete'; exit 1; }
          [[ -s "$ASC_KEY_PATH" ]] || { echo 'App Store Connect key file is missing'; exit 1; }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Full product quality gate
        run: npm run verify

      - name: Sync Capacitor iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Build, sign, and upload to TestFlight
        working-directory: ios/App
        run: bundle exec fastlane ios beta
