name: ON CALL Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: on-call-production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://oncallallday.com
      BACKEND_HEALTH_URL: https://cxdqkjvtpilvouwtbgdy.supabase.co/functions/v1/oncall-health
    steps:
      - name: Wait for exact Vercel production commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            body="$(curl -L --silent --show-error --connect-timeout 8 --max-time 15 "${BASE_URL}/release.json?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            live_sha="$(printf '%s\n' "$body" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
            if [[ "$live_sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving expected commit ${GITHUB_SHA}."
              break
            fi
            if [[ "$attempt" -eq 72 ]]; then
              echo "Production did not reach expected commit ${GITHUB_SHA}; last observed: ${live_sha:-unavailable}"
              echo "$body"
              exit 1
            fi
            echo "Waiting for Vercel production commit ${GITHUB_SHA}; observed ${live_sha:-unavailable} (attempt ${attempt}/72)"
            sleep 5
          done

      - name: Verify Supabase software health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 "$BACKEND_HEALTH_URL")"
          printf '%s' "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("checks",{}).get("payments",{}); c=d.get("checks",{}).get("catalog",{}); push=d.get("checks",{}).get("push",{}); assert d.get("software_status")=="ok", d; assert d.get("software_ready") is True, d; assert p.get("stripe_server_credential") is True, d; assert p.get("webhook_signature_secret") is True, d; assert p.get("payments_table_reachable") is True, d; assert push.get("ready") is True, d; assert int(c.get("active_services") or 0)>0, d; assert int(c.get("active_zones") or 0)>0, d; print("ON CALL backend software OK; activation status:", d.get("activation_status"))'

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/provider"
            "/apply"
            "/privacy"
            "/terms"
            "/support"
            "/auth/confirm"
            "/auth/reset"
          )
          for route in "${routes[@]}"; do
            out="$(mktemp)"
            code="$(curl -L --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 -o "$out" -w '%{http_code}' "${BASE_URL}${route}")"
            if [[ "$code" != "200" ]]; then
              echo "Production route failed: ${route} -> HTTP ${code}"
              cat "$out"
              exit 1
            fi
            bytes="$(wc -c < "$out" | tr -d ' ')"
            if [[ "$bytes" -lt 200 ]]; then
              echo "Production route returned an unexpectedly small response: ${route} (${bytes} bytes)"
              cat "$out"
              exit 1
            fi
            echo "OK ${route} (${bytes} bytes)"
            rm -f "$out"
          done

      - name: Verify production brand and PWA assets
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 "${BASE_URL}/")"
          grep -qi 'ON CALL' <<<"$home" || { echo 'ON CALL production brand shell is missing'; exit 1; }
          for asset in /manifest.json /marketplace-sw.js /release.json; do
            curl -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 "${BASE_URL}${asset}" >/dev/null
            echo "OK ${asset}"
          done
          echo 'ON CALL production smoke passed.'
