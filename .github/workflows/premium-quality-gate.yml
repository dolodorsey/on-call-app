name: ON CALL Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/premium-experience-upgrade

concurrency:
  group: on-call-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, build, and audit
        run: npm run verify
